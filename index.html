<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Quote Generator</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: #f2f2f2;
        padding-top: 100px;
      }

      .container {
        background: white;
        width: 400px;
        margin: auto;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 0 10px #ccc;
      }

      button {
        padding: 10px 20px;
        border: none;
        background: black;
        color: white;
        border-radius: 5px;
        cursor: pointer;
      }

      button:hover {
        background: #444;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Random Quote</h1>

      <p id="quote">Click the button to get a quote.</p>

      <button onclick="generateQuote()">Generate Quote</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
